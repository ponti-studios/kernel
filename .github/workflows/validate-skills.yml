name: validate-skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills.sh.json"
      - "runtime/**"
      - "scripts/bundle_runtime.py"
      - "scripts/check_isolated_packages.py"
      - "tests/**"
      - "scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "skills.sh.json"
      - "runtime/**"
      - "scripts/bundle_runtime.py"
      - "scripts/check_isolated_packages.py"
      - "tests/**"
      - "scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 scripts/bundle_runtime.py --check
      - run: python3 scripts/validate_skills.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_isolated_packages.py
