name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A dependency published as malicious on Friday is found on Monday, not on the next push.
    - cron: "0 7 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The history is the point: a token committed once and deleted later is still leaked.
          fetch-depth: 0
      - name: Scan the history for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v1
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Verify registry signatures
        run: npm audit signatures

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Semgrep (p/ci ruleset)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/ci --error --quiet
